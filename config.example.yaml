# Copy to local.yaml (git-ignored) and pass with --config local.yaml
dpi: 300
ocr:
  engine: rapidocr_v5   # rapidocr_v5 (default) | paddleocr_v5 | rapidocr_v6 | rapidocr_v4 | tesseract | onnxtr
  threads: 4            # lower to 2 if RAM is tight with paddleocr_v5
preprocess:
  block_size: 41
  c: 12
  remove_borders: true
classify:
  statement_min_score: 0.40
fields:
  app_id:
    labels: ["application id", "application no", "app no", "loan account no"]
